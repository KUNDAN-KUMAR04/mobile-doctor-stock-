<!-- FILE PATH: admin/dashboard.html  (INSIDE the admin folder — the MAIN admin panel, shown AFTER login) -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Stock Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="topbar">
    <div class="admin-topbar">
      <span class="brand-mark">STOCK<span>/</span>FINDER <span style="color: var(--text-muted); font-size: 12px;">admin</span></span>
      <span class="who">
        <span id="who-email"></span>
        &nbsp;·&nbsp;
        <a href="../index.html" style="color: var(--text-muted);">View site</a>
        &nbsp;·&nbsp;
        <a href="#" id="logout-link" style="color: var(--text-muted);">Log out</a>
      </span>
    </div>
  </div>

  <main>
    <!-- Places editor -->
    <div class="panel">
      <h2>Places</h2>
      <div id="places-editor" class="places-editor"></div>
      <div style="display:flex; gap:10px; margin-top: 8px;">
        <button type="button" id="add-place-btn" class="btn-secondary">+ Add place</button>
        <button type="button" id="save-places-btn" class="btn-primary">Save places</button>
      </div>
    </div>

    <!-- Add / edit model -->
    <div class="panel">
      <h2 id="form-title">Add / edit model</h2>
      <form id="model-form">
        <div class="form-grid">
          <div>
            <label class="field-label" for="f-deviceType">Device type</label>
            <select id="f-deviceType" class="search-input"></select>
            <input id="f-deviceType-other" class="search-input" style="display:none; margin-top:6px;" placeholder="New device type, e.g. Android" />
          </div>
          <div>
            <label class="field-label" for="f-brand">Brand</label>
            <select id="f-brand" class="search-input"></select>
            <input id="f-brand-other" class="search-input" style="display:none; margin-top:6px;" placeholder="New brand, e.g. Vivo" />
          </div>
          <div>
            <label class="field-label" for="f-box">Box</label>
            <select id="f-box" class="search-input"></select>
            <input id="f-box-other" class="search-input" style="display:none; margin-top:6px;" placeholder="New box, e.g. Vivo 1" />
          </div>
          <div>
            <label class="field-label" for="f-code">Model number (displayCode)</label>
            <input id="f-code" class="search-input" placeholder="e.g. 1802" />
          </div>
          <div>
            <label class="field-label" for="f-series">Series</label>
            <input id="f-series" class="search-input" list="seriesList" placeholder="e.g. Y-series" />
            <datalist id="seriesList"></datalist>
          </div>
          <div>
            <label class="field-label" for="f-model">Model name(s)</label>
            <input id="f-model" class="search-input" placeholder="e.g. Y18 / Y19 / 1902" required />
          </div>
          <div>
            <label class="field-label" for="f-stock">Stock quantity</label>
            <input id="f-stock" class="search-input" type="number" min="0" step="1" placeholder="e.g. 10" />
          </div>
        </div>

        <div class="status-line" style="margin: -4px 0 12px;">
          Separate multiple names with <strong>/</strong> if several models share this exact same stock — e.g. a universal display used across several phones. They'll all be searchable and all show the same quantity.
        </div>

        <label class="field-label">Stock by place</label>
        <div id="stock-inputs"></div>

        <div style="display:flex; gap:10px; margin-top: 12px;">
          <button type="submit" class="btn-primary">Save model</button>
          <button type="button" id="cancel-edit-btn" class="btn-secondary" style="display:none;">Cancel edit</button>
        </div>
      </form>
    </div>

    <!-- Existing inventory -->
    <div class="panel">
      <h2>Inventory</h2>
      <div class="inventory-filters">
        <input id="inv-search" class="search-input" type="text" style="flex: 1 1 220px;" placeholder="Search inventory (model, code, alias…)" />
        <select id="inv-deviceType" class="filter-select"></select>
        <select id="inv-brand" class="filter-select"></select>
        <select id="inv-box" class="filter-select"></select>
        <button type="button" id="inv-clear-btn" class="btn-secondary">Clear filters</button>
        <button type="button" id="inv-delete-brand-btn" class="btn-danger">Delete brand</button>
      </div>
      <div id="inv-count" class="status-line"></div>
      <div id="inventory-list"></div>
    </div>
  </main>

  <div id="toast" class="toast" style="display: none;"></div>

  <script type="module" src="admin.js"></script>
</body>
</html>
