<!-- FILE PATH: admin/dashboard.html  (INSIDE the admin folder — this is the MAIN admin panel, shown AFTER login) -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Stock Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="topbar">
    <div class="admin-topbar">
      <span class="brand-mark">STOCK<span>/</span>FINDER <span style="color: var(--text-muted); font-size: 12px;">admin</span></span>
      <span class="who">
        <span id="who-email"></span>
        &nbsp;·&nbsp;
        <a href="../index.html" style="color: var(--text-muted);">View site</a>
        &nbsp;·&nbsp;
        <a href="#" id="logout-link" style="color: var(--text-muted);">Log out</a>
      </span>
    </div>
  </div>

  <main>
    <div class="panel">
      <h2>Places</h2>
      <div id="places-editor" class="places-editor"></div>
      <button id="add-place-btn" class="btn-secondary">+ Add place</button>
      <button id="save-places-btn" class="btn-primary" style="margin-left: 8px;">Save places</button>
    </div>

    <div class="panel">
      <h2 id="form-title">Add / edit model</h2>
      <form id="model-form">
        <div class="form-grid">
          <div>
            <label class="field-label">Device type</label>
            <input id="f-deviceType" class="search-input" list="deviceTypeList" placeholder="Android" required />
            <datalist id="deviceTypeList"></datalist>
          </div>
          <div>
            <label class="field-label">Brand</label>
            <input id="f-brand" class="search-input" list="brandList" placeholder="Vivo" required />
            <datalist id="brandList"></datalist>
          </div>
          <div>
            <label class="field-label">Series</label>
            <input id="f-series" class="search-input" placeholder="Y-series" />
          </div>
          <div>
            <label class="field-label">Model</label>
            <input id="f-model" class="search-input" placeholder="Y18" required />
          </div>
          <div class="full">
            <label class="field-label">Display code</label>
            <input id="f-code" class="search-input" placeholder="1802" />
          </div>
        </div>
        <label class="field-label">Stock by place</label>
        <div id="stock-inputs"></div>
        <button type="submit" class="btn-primary" style="margin-top: 10px;">Save model</button>
        <button type="button" id="cancel-edit-btn" class="btn-secondary" style="margin-top: 10px; display: none;">Cancel edit</button>
      </form>
    </div>

    <div class="panel">
      <h2>Existing inventory</h2>
      <div id="inventory-list"></div>
    </div>
  </main>

  <div id="toast" class="toast" style="display: none;"></div>

  <script type="module" src="admin.js"></script>
</body>
</html>
