<!-- FILE PATH: admin/panel.html  (dashboard, protected — admin.js redirects here from / to index.html if logged out) -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Panel — Mobile Doctor</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="topbar">
    <div class="admin-topbar">
      <span class="brand-mark">Mobile<span>Doctor</span> Admin</span>
      <span class="who">
        <span id="who-email"></span> ·
        <a id="logout-link" class="admin-link" href="#">Log out</a>
      </span>
    </div>
  </header>

  <main>
    <!-- Places editor -->
    <section class="panel">
      <h2>Places</h2>
      <div id="places-editor" class="places-editor"></div>
      <div style="display:flex; gap:10px; margin-top: 8px;">
        <button type="button" id="add-place-btn" class="btn-secondary">+ Add place</button>
        <button type="button" id="save-places-btn" class="btn-primary">Save places</button>
      </div>
    </section>

    <!-- Add / edit model -->
    <section class="panel">
      <h2 id="form-title">Add / edit model</h2>
      <form id="model-form">
        <div class="form-grid">
          <div>
            <label class="field-label" for="f-deviceType">Device type</label>
            <select id="f-deviceType" class="search-input"></select>
            <input id="f-deviceType-other" class="search-input" style="display:none; margin-top:6px;" placeholder="New device type, e.g. Android" />
          </div>
          <div>
            <label class="field-label" for="f-brand">Brand</label>
            <select id="f-brand" class="search-input"></select>
            <input id="f-brand-other" class="search-input" style="display:none; margin-top:6px;" placeholder="New brand, e.g. Vivo" />
          </div>
          <div>
            <label class="field-label" for="f-box">Box</label>
            <select id="f-box" class="search-input"></select>
            <input id="f-box-other" class="search-input" style="display:none; margin-top:6px;" placeholder="New box, e.g. Vivo 1" />
          </div>
          <div>
            <label class="field-label" for="f-code">Model number (displayCode)</label>
            <input id="f-code" class="search-input" placeholder="e.g. 1802" />
          </div>
          <div>
            <label class="field-label" for="f-series">Series</label>
            <input id="f-series" class="search-input" list="seriesList" placeholder="e.g. Y-series" />
            <datalist id="seriesList"></datalist>
          </div>
          <div>
            <label class="field-label" for="f-model">Model name</label>
            <input id="f-model" class="search-input" placeholder="e.g. Y18" required />
          </div>
        </div>

        <label class="field-label">Stock by place</label>
        <div id="stock-inputs"></div>

        <div style="display:flex; gap:10px; margin-top: 12px;">
          <button type="submit" class="btn-primary">Save model</button>
          <button type="button" id="cancel-edit-btn" class="btn-secondary" style="display:none;">Cancel edit</button>
        </div>
      </form>
    </section>

    <!-- Existing inventory -->
    <section class="panel">
      <h2>Inventory</h2>
      <div class="inventory-filters">
        <select id="inv-deviceType" class="filter-select"></select>
        <select id="inv-brand" class="filter-select"></select>
        <select id="inv-box" class="filter-select"></select>
        <button type="button" id="inv-clear-btn" class="btn-secondary">Clear filters</button>
      </div>
      <div id="inventory-list"></div>
    </section>
  </main>

  <div id="toast" class="toast" style="display:none;"></div>

  <script type="module" src="admin.js"></script>
</body>
</html>
