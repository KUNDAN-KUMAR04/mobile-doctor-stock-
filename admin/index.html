<!-- FILE PATH: admin/index.html  (login page) -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login — Mobile Doctor</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="login-wrap">
    <form id="login-form" class="login-card">
      <span class="brand-mark" style="display:block; margin-bottom: 18px;">Mobile<span>Doctor</span> Admin</span>

      <label class="field-label" for="email">Email</label>
      <input id="email" class="search-input" type="email" required style="width:100%; margin-bottom: 14px;" />

      <label class="field-label" for="password">Password</label>
      <input id="password" class="search-input" type="password" required style="width:100%; margin-bottom: 18px;" />

      <button type="submit" class="btn-primary" style="width:100%;">Log in</button>
      <div id="error-text" class="error-text"></div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from "../firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Already logged in? Skip straight to the dashboard.
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "panel.html";
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("error-text");
      errorEl.textContent = "";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "panel.html";
      } catch (err) {
        errorEl.textContent = "Login failed — check your email and password.";
      }
    });
  </script>
</body>
</html>
