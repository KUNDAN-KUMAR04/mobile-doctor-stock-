<!-- FILE PATH: admin/index.html  (INSIDE the admin folder — this is the LOGIN page) -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Stock Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="login-wrap">
    <form id="login-form" class="login-card">
      <div class="brand-mark" style="margin-bottom: 18px;">STOCK<span>/</span>FINDER <span style="color: var(--text-muted); font-size: 12px;">admin</span></div>
      <label class="field-label">Email</label>
      <input id="email" class="search-input" type="email" required autocomplete="username" />
      <label class="field-label" style="margin-top: 12px;">Password</label>
      <input id="password" class="search-input" type="password" required autocomplete="current-password" />
      <button type="submit" class="btn-primary" style="margin-top: 18px; width: 100%;">Log in</button>
      <div id="login-error" class="error-text"></div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from "../firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "panel.html"; // FIXED: was "dashboard.html", which is missing fields admin.js needs
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("login-error");
      errorEl.textContent = "";
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        console.error("Login error:", err.code, err.message);
        errorEl.textContent = `Login failed: ${err.code || err.message}`;
      }
    });
  </script>
</body>
</html>
